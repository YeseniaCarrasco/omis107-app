<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe</title>
<style>
  :root {
    --bg: #e6f4ea;
    --card: #ffffff;
    --ink: #1b4d2e;
    --x: #14532d;
    --o: #4d7c0f;
    --win: #b7ebc6;
    --line: #9fd3ae;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 16px;
  }
  h1 { margin: 0; font-size: 1.8rem; }
  .scoreboard { display: flex; gap: 12px; }
  .score {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 8px 18px;
    text-align: center;
    min-width: 90px;
  }
  .score .label { font-size: 0.8rem; opacity: 0.7; }
  .score .num { font-size: 1.5rem; font-weight: 700; }
  .score.x .num { color: var(--x); }
  .score.o .num { color: var(--o); }
  #status { font-size: 1.2rem; min-height: 1.6em; font-weight: 600; }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: min(90vw, 360px);
    aspect-ratio: 1;
  }
  .cell {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 10px;
    font-size: clamp(2.5rem, 14vw, 4.5rem);
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    color: var(--ink);
  }
  .cell:hover:not(:disabled) { background: #f1faf4; }
  .cell:disabled { cursor: default; }
  .cell.x { color: var(--x); }
  .cell.o { color: var(--o); }
  .cell.win { background: var(--win); }
  .buttons { display: flex; gap: 10px; }
  .settings { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .setting { display: flex; align-items: center; gap: 6px; }
  .setting select {
    font: inherit;
    padding: 6px 8px;
    border: 2px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    background: var(--card);
  }
  button.action {
    font: inherit;
    padding: 8px 16px;
    border-radius: 8px;
    border: 2px solid var(--ink);
    background: var(--ink);
    color: #fff;
    cursor: pointer;
  }
  button.action.secondary { background: transparent; color: var(--ink); }
</style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>

  <div class="scoreboard">
    <div class="score x"><div class="label">Player X</div><div class="num" id="scoreX">0</div></div>
    <div class="score"><div class="label">Draws</div><div class="num" id="scoreD">0</div></div>
    <div class="score o"><div class="label">Player O</div><div class="num" id="scoreO">0</div></div>
  </div>

  <div id="status" aria-live="polite"></div>
  <div id="board" role="grid" aria-label="Tic-tac-toe board"></div>

  <div class="settings">
    <label class="setting" for="gameMode">Play
      <select id="gameMode">
        <option value="two">2 players</option>
        <option value="computer">vs computer</option>
      </select>
    </label>
    <label class="setting" for="difficulty">Difficulty
      <select id="difficulty" disabled>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
    </label>
  </div>

  <div class="buttons">
    <button class="action" id="newGame">New game</button>
    <button class="action secondary" id="resetScores">Reset scores</button>
  </div>

<script>
(function () {
  const WIN_LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
    [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
    [0, 4, 8], [2, 4, 6]             // diagonals
  ];

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const modeEl = document.getElementById('gameMode');
  const difficultyEl = document.getElementById('difficulty');
  const scoreEls = {
    X: document.getElementById('scoreX'),
    O: document.getElementById('scoreO'),
    D: document.getElementById('scoreD')
  };

  let board, current, gameOver, startingPlayer = 'X', computerTimer;
  let turnId = 0;
  const scores = { X: 0, O: 0, D: 0 };

  // Build the 9 cells once.
  const cells = [];
  for (let i = 0; i < 9; i++) {
    const btn = document.createElement('button');
    btn.className = 'cell';
    btn.setAttribute('aria-label', 'Cell ' + (i + 1));
    btn.addEventListener('click', () => play(i));
    boardEl.appendChild(btn);
    cells.push(btn);
  }

  function newGame() {
    clearTimeout(computerTimer);
    turnId++;
    board = Array(9).fill(null);
    current = modeEl.value === 'computer' ? 'X' : startingPlayer;
    gameOver = false;
    cells.forEach(c => {
      c.textContent = '';
      c.disabled = false;
      c.className = 'cell';
    });
    updateTurn();
  }

  function findWinner() {
    for (const line of WIN_LINES) {
      const [a, b, c] = line;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        return { player: board[a], line };
      }
    }
    return null;
  }

  function finishTurn() {
    const result = findWinner();
    if (result) {
      endGame("Player " + result.player + " wins!");
      scores[result.player]++;
      result.line.forEach(idx => cells[idx].classList.add('win'));
    } else if (board.every(Boolean)) {
      endGame("It's a draw!");
      scores.D++;
    } else {
      current = current === 'X' ? 'O' : 'X';
      updateTurn();
      if (modeEl.value === 'computer' && current === 'O') computerMove();
    }
    renderScores();
  }

  function play(i) {
    if (gameOver || board[i] || (modeEl.value === 'computer' && current === 'O')) return;
    placeMove(i, current);
  }

  function placeMove(i, player) {
    board[i] = player;
    cells[i].textContent = player;
    cells[i].classList.add(player.toLowerCase());
    cells[i].disabled = true;
    finishTurn();
  }

  function updateTurn() {
    statusEl.textContent = modeEl.value === 'computer' && current === 'O'
      ? 'Computer is thinking...'
      : "Player " + current + "'s turn";
  }

  function computerMove() {
    const currentTurn = turnId;
    computerTimer = setTimeout(() => {
      if (gameOver || currentTurn !== turnId) return;
      const move = chooseComputerMove();
      placeMove(move, 'O');
    }, 300);
  }

  function chooseComputerMove() {
    const available = board.map((value, index) => value ? -1 : index).filter(index => index >= 0);
    const difficulty = difficultyEl.value;
    if (difficulty === 'easy') return randomMove(available);
    if (difficulty === 'medium') {
      return findImmediateMove('O') ?? findImmediateMove('X') ?? randomMove(available);
    }
    return bestMove();
  }

  function randomMove(moves) {
    return moves[Math.floor(Math.random() * moves.length)];
  }

  function findImmediateMove(player) {
    for (let i = 0; i < board.length; i++) {
      if (!board[i]) {
        board[i] = player;
        const wins = Boolean(findWinner());
        board[i] = null;
        if (wins) return i;
      }
    }
    return null;
  }

  function bestMove() {
    let bestScore = -Infinity;
    let move = -1;
    for (let i = 0; i < board.length; i++) {
      if (!board[i]) {
        board[i] = 'O';
        const score = minimax(false, 0);
        board[i] = null;
        if (score > bestScore) {
          bestScore = score;
          move = i;
        }
      }
    }
    return move;
  }

  function minimax(isComputerTurn, depth) {
    const result = findWinner();
    if (result) return result.player === 'O' ? 10 - depth : depth - 10;
    if (board.every(Boolean)) return 0;

    let bestScore = isComputerTurn ? -Infinity : Infinity;
    const player = isComputerTurn ? 'O' : 'X';
    for (let i = 0; i < board.length; i++) {
      if (!board[i]) {
        board[i] = player;
        const score = minimax(!isComputerTurn, depth + 1);
        board[i] = null;
        bestScore = isComputerTurn ? Math.max(bestScore, score) : Math.min(bestScore, score);
      }
    }
    return bestScore;
  }

  function endGame(message) {
    gameOver = true;
    statusEl.textContent = message;
    cells.forEach(c => (c.disabled = true));
    // Alternate who goes first each round.
    startingPlayer = startingPlayer === 'X' ? 'O' : 'X';
  }

  function renderScores() {
    scoreEls.X.textContent = scores.X;
    scoreEls.O.textContent = scores.O;
    scoreEls.D.textContent = scores.D;
  }

  document.getElementById('newGame').addEventListener('click', newGame);
  modeEl.addEventListener('change', () => {
    difficultyEl.disabled = modeEl.value !== 'computer';
    newGame();
  });
  difficultyEl.addEventListener('change', newGame);
  document.getElementById('resetScores').addEventListener('click', () => {
    scores.X = scores.O = scores.D = 0;
    startingPlayer = 'X';
    renderScores();
    newGame();
  });

  newGame();
})();
</script>
</body>
</html>
